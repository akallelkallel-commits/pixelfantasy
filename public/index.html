<style>

.cg{display:grid;gap:3px}.cg.c2{grid-template-columns:repeat(2,42px)}.cg.c3{grid-template-columns:repeat(3,42px)}

body.menu #hud,body.menu #btns,body.menu #bottom,body.menu #touch,body.menu #boss,body.menu #fl{display:none}

.mm{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.big{font-size:18px;padding:10px 14px}
